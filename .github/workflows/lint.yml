name: lint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false   
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Run `dotnet format` command
        run: |
          dotnet restore
          dotnet format --no-restore -v diag

      # Show diff file names (It's required when using dryrun option)
      - name: Show diff file names
        run: |
          git diff --name-only

      # Commit updated snapshot contents
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: auto-commit-action
        if: ${{ github.event.inputs.dryrun == 'false'}} 
        with:
          commit_message: 'test(snapshot): update snapshots ${{ github.sha }}'

      - shell: pwsh
        run: |
           $content = Get-Content /home/runner/work/docfx/docfx/test/Docfx.Dotnet.Tests/XmlCommentTests/XmlCommentExamplesTest.cs -Raw
           Write-Output $content >> $env:GITHUB_STEP_SUMMARY

      - name: Report failures as Job Summary
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $content = '
          ## Failed to run the `lint.yml` workflow
          To fix workflow errors. Please follow the steps below.
           1. Run `dotnet format` command.
           2. Commit changes as separated commit.
           3. Push changes to source branch of PR.
          '
          Write-Output $content >> $env:GITHUB_STEP_SUMMARY
